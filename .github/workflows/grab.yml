name: grab-a1

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: grab-a1
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q oci
      - id: grab
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_REGION: us-sanjose-1
          ATTEMPTS: "340"
          INTERVAL_SECONDS: "55"
          BOOT_VOLUME_GB: "200"
        run: python -u grab.py
      - name: 抢到后自动停用本 workflow
        if: steps.grab.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable grab.yml -R "${{ github.repository }}"
      - name: 抢到了！发邮件通知
        if: steps.grab.outputs.done == 'true'
        run: |
          echo "::error::抢到了！去 OCI 控制台 Instances 查看 a1-free，用 oci_a1 私钥登录"
          exit 1
